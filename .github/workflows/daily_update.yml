name: Daily Mileage Challenge Update

on:
  schedule:
    # 15:59 UTC is 23:59 on the same day in Singapore.
    - cron: "59 15 * * *"
  workflow_dispatch:

concurrency:
  group: participant-config
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate required secrets
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PARTICIPANT_CONFIG_JSON: ${{ secrets.PARTICIPANT_CONFIG_JSON }}
        run: |
          test -n "$STRAVA_CLIENT_ID" || (echo "Missing STRAVA_CLIENT_ID" && exit 1)
          test -n "$STRAVA_CLIENT_SECRET" || (echo "Missing STRAVA_CLIENT_SECRET" && exit 1)
          test -n "$TELEGRAM_BOT_TOKEN" || (echo "Missing TELEGRAM_BOT_TOKEN" && exit 1)
          test -n "$TELEGRAM_CHAT_ID" || (echo "Missing TELEGRAM_CHAT_ID" && exit 1)
          test -n "$PARTICIPANT_CONFIG_JSON" || (echo "Missing PARTICIPANT_CONFIG_JSON" && exit 1)

      - name: Write participant config from secret
        env:
          PARTICIPANT_CONFIG_JSON: ${{ secrets.PARTICIPANT_CONFIG_JSON }}
        run: |
          printf '%s' "$PARTICIPANT_CONFIG_JSON" > "$RUNNER_TEMP/participant_config.json"
          chmod 600 "$RUNNER_TEMP/participant_config.json"

      - name: Fetch Strava activities
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
        run: |
          fetch_status=0
          python scripts/fetch_strava.py \
            --config "$RUNNER_TEMP/participant_config.json" \
            --output generated/activities.json \
            --updated-config-output "$RUNNER_TEMP/participant_config.updated.json" \
            --fail-on-participant-errors || fetch_status=$?
          if [ -f "$RUNNER_TEMP/participant_config.updated.json" ]; then
            if [ -z "$GH_SECRETS_TOKEN" ]; then
              echo "::error::Strava returned rotated refresh tokens, but GH_SECRETS_TOKEN is not configured. Add that secret so this workflow can update PARTICIPANT_CONFIG_JSON securely."
              exit 1
            fi
            GH_TOKEN="$GH_SECRETS_TOKEN" gh secret set PARTICIPANT_CONFIG_JSON < "$RUNNER_TEMP/participant_config.updated.json"
            echo "Updated PARTICIPANT_CONFIG_JSON with rotated Strava refresh token(s)."
          fi
          exit "$fetch_status"

      - name: Build leaderboard JSON
        run: python scripts/build_leaderboard.py --input generated/activities.json --output data/leaderboard.json

      - name: Send Telegram update
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/send_telegram.py --leaderboard data/leaderboard.json

      - name: Commit leaderboard update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/leaderboard.json
          if git diff --cached --quiet; then
            echo "No leaderboard changes to commit."
          else
            git commit -m "Update mileage challenge leaderboard"
            git pull --rebase
            git push
          fi
